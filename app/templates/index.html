<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 智能助手</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <button id="new-chat-btn" class="new-chat-btn">+ 新对话</button>
            </div>
            <div class="conversation-list" id="conversation-list">
                {% for conv in conversations %}
                <div class="conversation-item {% if loop.first %}active{% endif %}" data-id="{{ conv.id }}">
                    <span class="conv-title">{{ conv.title }}</span>
                    <button class="rename-btn" data-id="{{ conv.id }}" title="重命名">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"></path></svg>
                    </button>
                    <button class="delete-btn" data-id="{{ conv.id }}">×</button>
                </div>
                {% endfor %}
            </div>

            <div class="kb-section">
                <div class="kb-header">
                    <span class="kb-title">知识库</span>
                    <label class="upload-btn-label" title="上传文档">
                        <input type="file" id="file-upload" accept=".txt,.md,.pdf,.docx" hidden>
                        <span class="upload-btn">+</span>
                    </label>
                </div>
                <div class="kb-doc-list" id="kb-doc-list">
                    <div class="kb-empty">暂无文档，点击 + 上传</div>
                </div>
            </div>

            <!-- 代码库索引管理 -->
            <div class="kb-section code-index-section">
                <div class="kb-header">
                    <span class="kb-title">代码库</span>
                    <label class="upload-btn-label" title="添加代码库">
                        <button id="add-repo-btn" class="upload-btn">+</button>
                    </label>
                </div>
                <div class="code-repo-list" id="code-repo-list">
                    <div class="kb-empty">暂无代码库，点击 + 添加</div>
                </div>
            </div>
        </aside>

        <!-- 添加代码库弹窗 - 放在 aside 外面 -->
        <div id="add-repo-modal" class="modal-overlay" style="display:none;">
            <div class="modal-box">
                <div class="modal-title">添加代码库</div>
                <div class="modal-body">
                    <div class="form-group">
                        <label>仓库名称</label>
                        <input type="text" id="repo-name-input" placeholder="例如: flask_chat" class="modal-input">
                    </div>
                    <div class="form-group">
                        <label>仓库路径</label>
                        <input type="text" id="repo-path-input" placeholder="例如: /path/to/repo" class="modal-input">
                    </div>
                </div>
                <div class="modal-actions">
                    <button class="modal-btn modal-cancel modal-cancel-btn">取消</button>
                    <button class="modal-btn modal-confirm" id="confirm-add-repo">确认添加</button>
                </div>
            </div>
        </div>

        <!-- 搜索测试弹窗 - 放在 aside 外面 -->
        <div id="search-test-modal" class="modal-overlay" style="display:none;">
            <div class="modal-box">
                <div class="modal-title">搜索测试</div>
                <div class="modal-body">
                    <div class="form-group">
                        <label>查询内容</label>
                        <textarea id="search-query-input" placeholder="输入搜索内容..." class="modal-input" rows="3"></textarea>
                    </div>
                    <div class="form-group">
                        <label>返回结果数</label>
                        <input type="number" id="search-top-k-input" value="5" min="1" max="20" class="modal-input">
                    </div>
                    <button class="modal-btn modal-confirm" id="run-search-btn">开始搜索</button>
                    <div id="search-results" class="search-results"></div>
                </div>
                <div class="modal-actions">
                    <button class="modal-btn modal-cancel modal-close-btn">关闭</button>
                </div>
            </div>
        </div>

        <!-- 确认操作弹窗 -->
        <div id="confirm-modal" class="modal-overlay" style="display:none;">
            <div class="modal-box">
                <div class="modal-title" id="confirm-title">确认操作</div>
                <div class="modal-body">
                    <p id="confirm-message"></p>
                </div>
                <div class="modal-actions">
                    <button class="modal-btn modal-cancel" id="confirm-cancel">取消</button>
                    <button class="modal-btn modal-confirm" id="confirm-ok">确认</button>
                </div>
            </div>
        </div>

        <!-- Toast 提示容器 -->
        <div id="toast-container" class="toast-container"></div>

        <main class="chat-area">
            <div class="chat-header">
                <h2 id="chat-title">AI 智能助手</h2>
                <div class="header-actions">
                    <select id="model-selector" class="model-selector"></select>
                    <label class="verify-toggle" title="开启后，AI 回答将自动经过另一个 Agent 结果验证">
                        <input type="checkbox" id="verify-switch">
                        <span class="toggle-slider"></span>
                        <span class="toggle-label">结果验证</span>
                    </label>
                    <button id="share-btn" class="header-action-btn" title="分享对话">🔗</button>
                    <button id="export-btn" class="header-action-btn" title="导出对话">📥</button>
                    <button id="interrupt-btn" class="interrupt-btn" style="display:none;">⏹ 打断</button>
                </div>
            </div>

            <div class="messages-container" id="messages-container">
                <div class="welcome-message">
                    <p>你好！我是AI智能助手，有什么可以帮你的吗？</p>
                    <p class="hint">支持工具调用 · 流式输出 · 上下文压缩 · RAG知识检索</p>
                </div>
            </div>

            <div class="input-area">
                <div class="input-wrapper">
                    <textarea id="message-input" placeholder="输入消息... (Enter发送, Shift+Enter换行)" rows="1"></textarea>
                    <button id="send-btn" class="send-btn">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M22 2L11 13M22 2L15 22L11 13L2 9L22 2Z"/>
                        </svg>
                    </button>
                </div>
            </div>
        </main>
    </div>

    <!-- Marked.js 用于 Markdown 渲染（本地版本，避免 CDN 加载失败） -->
    <script src="{{ url_for('static', filename='js/marked.min.js') }}"></script>
    <script src="{{ url_for('static', filename='js/chat.js') }}"></script>
</body>
</html>
