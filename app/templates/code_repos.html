<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>代码库管理 - AI 智能助手</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <a href="/" class="back-to-chat">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M19 12H5M12 19l-7-7 7-7"/>
                    </svg>
                    <span>返回对话</span>
                </a>
            </div>
            <div class="sidebar-nav">
                <a href="/knowledge" class="nav-item">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
                        <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
                    </svg>
                    <span>知识库</span>
                </a>
                <a href="/code-repos" class="nav-item active">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M16 18l6-6-6-6M8 6l-6 6 6 6"/>
                    </svg>
                    <span>代码库</span>
                </a>
            </div>
        </aside>

        <main class="code-repos-area">
            <div class="code-repos-header">
                <h2>代码库管理</h2>
                <div class="header-actions">
                    <button id="add-repo-btn" class="add-repo-btn">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M12 5v14M5 12h14"/>
                        </svg>
                        添加代码库
                    </button>
                </div>
            </div>

            <div class="code-repos-content">
                <div class="code-repos-stats" id="code-repos-stats">
                    <!-- 动态加载统计信息 -->
                </div>

                <div class="code-repos-list" id="code-repo-list">
                    <div class="kb-empty">暂无代码库，点击上方按钮添加</div>
                </div>
            </div>
        </main>
    </div>

    <!-- 添加代码库弹窗 -->
    <div id="add-repo-modal" class="modal-overlay" style="display:none;">
        <div class="modal-box">
            <div class="modal-title">添加代码库</div>
            <div class="modal-body">
                <div class="form-group">
                    <label>仓库名称</label>
                    <input type="text" id="repo-name-input" placeholder="例如: flask_chat" class="modal-input">
                </div>
                <div class="form-group">
                    <label>仓库路径</label>
                    <input type="text" id="repo-path-input" placeholder="例如: /path/to/repo" class="modal-input">
                </div>
            </div>
            <div class="modal-actions">
                <button class="modal-btn modal-cancel modal-cancel-btn">取消</button>
                <button class="modal-btn modal-confirm" id="confirm-add-repo">确认添加</button>
            </div>
        </div>
    </div>

    <!-- 搜索测试弹窗 -->
    <div id="search-test-modal" class="modal-overlay" style="display:none;">
        <div class="modal-box">
            <div class="modal-title">搜索测试</div>
            <div class="modal-body">
                <div class="form-group">
                    <label>查询内容</label>
                    <textarea id="search-query-input" placeholder="输入搜索内容..." class="modal-input" rows="3"></textarea>
                </div>
                <div class="form-group">
                    <label>返回结果数</label>
                    <input type="number" id="search-top-k-input" value="5" min="1" max="20" class="modal-input">
                </div>
                <button class="modal-btn modal-confirm" id="run-search-btn">开始搜索</button>
                <div id="search-results" class="search-results"></div>
            </div>
            <div class="modal-actions">
                <button class="modal-btn modal-cancel modal-close-btn">关闭</button>
            </div>
        </div>
    </div>

    <!-- 确认操作弹窗 -->
    <div id="confirm-modal" class="modal-overlay" style="display:none;">
        <div class="modal-box">
            <div class="modal-title" id="confirm-title">确认操作</div>
            <div class="modal-body">
                <p id="confirm-message"></p>
            </div>
            <div class="modal-actions">
                <button class="modal-btn modal-cancel" id="confirm-cancel">取消</button>
                <button class="modal-btn modal-confirm" id="confirm-ok">确认</button>
            </div>
        </div>
    </div>

    <!-- 索引模式选择弹窗 -->
    <div id="index-mode-modal" class="modal-overlay" style="display:none;">
        <div class="modal-box">
            <div class="modal-title">构建索引</div>
            <div class="modal-body">
                <div class="index-mode-options">
                    <label class="index-mode-option">
                        <input type="radio" name="index-mode" value="full" checked>
                        <div class="index-mode-content">
                            <div class="index-mode-name">全量构建</div>
                            <div class="index-mode-desc">清空现有索引，重新构建所有文件</div>
                        </div>
                    </label>
                    <label class="index-mode-option">
                        <input type="radio" name="index-mode" value="incremental">
                        <div class="index-mode-content">
                            <div class="index-mode-name">增量构建</div>
                            <div class="index-mode-desc">只构建新增或修改的文件，保留未变化的索引</div>
                        </div>
                    </label>
                </div>
            </div>
            <div class="modal-actions">
                <button class="modal-btn modal-cancel" id="index-mode-cancel">取消</button>
                <button class="modal-btn modal-confirm" id="index-mode-ok">开始构建</button>
            </div>
        </div>
    </div>

    <!-- Toast 提示容器 -->
    <div id="toast-container" class="toast-container"></div>

    <script src="{{ url_for('static', filename='js/code_repos.js') }}"></script>
</body>
</html>
