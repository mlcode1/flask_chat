version: '3.8'

services:
  # PostgreSQL database
  postgres:
    image: postgres:15-alpine
    container_name: flask_chat_db
    environment:
      POSTGRES_DB: flask_chat
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis cache
  redis:
    image: redis:7-alpine
    container_name: flask_chat_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Flask application
  web:
    build: .
    container_name: flask_chat_web
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/flask_chat
      - REDIS_URL=redis://redis:6379/0
      - REDIS_ENABLED=true
      - FLASK_ENV=production
      - FLASK_SECRET_KEY=${FLASK_SECRET_KEY:-change-this-in-production}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.openai.com/v1}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o}
      - EMBEDDING_BASE_URL=${EMBEDDING_BASE_URL}
      - EMBEDDING_API_KEY=${EMBEDDING_API_KEY}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-qwen3-embedding:8b}
      - EMBEDDING_DIM=${EMBEDDING_DIM:-4096}
      - CODE_INDEX_DB_HOST=postgres
      - CODE_INDEX_DB_PORT=5432
      - CODE_INDEX_DB_USER=postgres
      - CODE_INDEX_DB_PASSWORD=postgres
      - CODE_INDEX_DB_NAME=flask_chat
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads
      - ./code_repos:/app/code_repos
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
